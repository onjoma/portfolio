  <rect x="14" y="130" width="48" height="3" fill="#1a4a7a" rx="1" opacity="0.25"/>
  <rect x="106" y="122" width="65" height="4" fill="#1a4a7a" rx="1" opacity="0.4"/>
  <rect x="106" y="130" width="48" height="3" fill="#1a4a7a" rx="1" opacity="0.25"/>
