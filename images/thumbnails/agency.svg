<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 160">
  <!-- Background dark -->
  <rect width="280" height="160" fill="#0f0f1a" rx="6"/>
  <!-- Browser bar -->
  <rect width="280" height="22" fill="#1e1e30" rx="6"/>
  <rect y="11" width="280" height="11" fill="#1e1e30"/>
  <circle cx="12" cy="11" r="4" fill="#ff5f57"/>
  <circle cx="24" cy="11" r="4" fill="#ffbd2e"/>
  <circle cx="36" cy="11" r="4" fill="#28c840"/>
  <rect x="60" y="6" width="160" height="10" fill="#2e2e44" rx="5" opacity="0.7"/>
  <!-- Nav -->
  <rect x="10" y="28" width="40" height="6" fill="#e4b84a" rx="1" opacity="0.9"/>
  <rect x="180" y="28" width="28" height="6" fill="white" rx="1" opacity="0.3"/>
  <rect x="218" y="28" width="28" height="6" fill="white" rx="1" opacity="0.3"/>
  <rect x="256" y="27" width="16" height="8" fill="#cd2653" rx="2"/>
  <!-- Big bold headline -->
  <rect x="20" y="48" width="180" height="14" fill="white" rx="2" opacity="0.95"/>
  <rect x="20" y="67" width="140" height="14" fill="white" rx="2" opacity="0.95"/>
  <!-- Accent underline -->
  <rect x="20" y="85" width="80" height="4" fill="#e4b84a" rx="2"/>
  <!-- Sub text -->
  <rect x="20" y="95" width="160" height="6" fill="white" rx="1" opacity="0.35"/>
  <rect x="20" y="105" width="130" height="6" fill="white" rx="1" opacity="0.25"/>
  <!-- CTA buttons -->
  <rect x="20" y="118" width="75" height="18" fill="#cd2653" rx="4"/>
  <rect x="105" y="118" width="75" height="18" fill="none" stroke="#e4b84a" stroke-width="1.5" rx="4"/>
  <rect x="30" y="122" width="55" height="10" fill="white" rx="1" opacity="0.85"/>
  <rect x="115" y="122" width="55" height="10" fill="#e4b84a" rx="1" opacity="0.7"/>
  <!-- Abstract shape right -->
  <circle cx="230" cy="95" r="40" fill="#cd2653" opacity="0.08"/>
  <circle cx="230" cy="95" r="28" fill="#cd2653" opacity="0.1"/>
  <circle cx="230" cy="95" r="14" fill="#cd2653" opacity="0.15"/>
</svg>
