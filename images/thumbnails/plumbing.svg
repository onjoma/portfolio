  <rect x="44" y="104" width="6" height="13" fill="#1a4a7a" rx="2" opacity="0.7"/>
  <rect x="130" y="108" width="18" height="5" fill="#1a4a7a" rx="2" opacity="0.7"/>
  <circle cx="139" cy="110" r="6" fill="none" stroke="#1a4a7a" stroke-width="3" opacity="0.5"/>
  <rect x="224" y="108" width="18" height="5" fill="#1a4a7a" rx="2" opacity="0.7"/>
  <rect x="224" y="113" width="18" height="5" fill="#1a4a7a" rx="2" opacity="0.7"/>
