    <link rel="stylesheet" href="css/main.css" />
    <title>Contact Peter Onjoma — Hire a Freelance Web Developer</title>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Peter Onjoma",
      "url": "https://onjomapeter.com",
      "jobTitle": "Freelance Web Developer",
      "description": "Freelance Web Developer and Virtual Assistant specialising in WordPress, HTML, CSS, JavaScript, Python and Flask.",
      "knowsAbout": ["WordPress", "HTML", "CSS", "JavaScript", "Python", "Flask"],
      "sameAs": [
        "https://twitter.com/onjoma",
        "https://www.linkedin.com/in/onjomapeter/",
        "https://github.com/onjoma"
      ]
    }
    </script>
  </head>
  <body>
    <div class="container">
      <div class="about-page">
        <div class="navbar">
          <ul>
            <li><a href="/index.html">home</a></li>
            <li><a href="/about.html">about</a></li>
            <li><a href="/contact.html" class="active">contact</a></li>
            <li><a href="/work.html">my work</a></li>
          </ul>
        </div>
        <div class="about-me">
          <h1>Get In Touch</h1>
          <p class="contact-intro">
            Have a project in mind or just want to say
            <span class="wave-hand"><img src="/images/waving-hand-sign.png" alt="waving hand" loading="lazy" /></span>
            I'd love to hear from you.
          </p>

          <div class="contact-card">
            <form name="contact" method="POST" data-netlify="true">
              <div class="form-group">
                <label for="name" class="sr-only">Your name</label>
                <input
                  type="text"
                  name="name"
                  id="name"
                  placeholder="Name"
                  class="form-control"
                />
              </div>
              <div class="form-group">
                <label for="email" class="sr-only">Your email address</label>
                <input
                  type="email"
                  name="email"
                  id="email"
                  placeholder="Email"
                  class="form-control"
                />
              </div>
              <div class="form-group">
                <label for="message" class="sr-only">Your message</label>
                <textarea
                  name="message"
                  id="message"
                  cols="30"
                  rows="5"
                  placeholder="Message"
                  class="form-control"
                ></textarea>
              </div>
              <div data-netlify-recaptcha="true"></div>
              <button class="btn btn-primary" type="submit">Send Message</button>
              <p class="response-note">I typically respond within 24 hours.</p>
            </form>
          </div>

          <p class="contact-alt-label">or find me on</p>
        </div>
      </div>
      <div id="footer"></div>
    </div>
    <script src="/js/footer.js"></script>
  </body>
</html>
