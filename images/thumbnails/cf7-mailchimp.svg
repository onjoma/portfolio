<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 160">
  <!-- Background -->
  <rect width="280" height="160" fill="#f0f0f1" rx="6"/>
  <!-- Browser bar -->
  <rect width="280" height="22" fill="#d8d8e0" rx="6"/>
  <rect y="11" width="280" height="11" fill="#d8d8e0"/>
  <circle cx="12" cy="11" r="4" fill="#ff5f57"/>
  <circle cx="24" cy="11" r="4" fill="#ffbd2e"/>
  <circle cx="36" cy="11" r="4" fill="#28c840"/>
  <rect x="60" y="6" width="160" height="10" fill="white" rx="5" opacity="0.5"/>
  <!-- WP Admin top bar -->
  <rect x="0" y="22" width="280" height="18" fill="#1d2327"/>
  <rect x="8" y="26" width="20" height="10" fill="#21759b" rx="2" opacity="0.9"/>
  <rect x="34" y="29" width="40" height="5" fill="white" rx="1" opacity="0.4"/>
  <rect x="84" y="29" width="35" height="5" fill="white" rx="1" opacity="0.3"/>
  <!-- Page background -->
  <rect x="0" y="40" width="280" height="120" fill="#e8e8ec" rx="0 0 6 6"/>

  <!-- CF7 form card (left side) -->
  <rect x="12" y="48" width="108" height="102" fill="white" rx="5"/>
  <!-- CF7 label / header -->
  <rect x="12" y="48" width="108" height="18" fill="#21759b" rx="5 5 0 0"/>
  <rect x="20" y="53" width="60" height="7" fill="white" rx="2" opacity="0.85"/>
  <!-- Form fields -->
  <rect x="20" y="74" width="92" height="8" fill="#f0f0f1" rx="2" stroke="#ccc" stroke-width="0.5"/>
  <rect x="20" y="87" width="92" height="8" fill="#f0f0f1" rx="2" stroke="#ccc" stroke-width="0.5"/>
  <rect x="20" y="100" width="92" height="8" fill="#f0f0f1" rx="2" stroke="#ccc" stroke-width="0.5"/>
  <rect x="20" y="113" width="92" height="18" fill="#f0f0f1" rx="2" stroke="#ccc" stroke-width="0.5"/>
  <!-- Submit button -->
  <rect x="20" y="136" width="60" height="10" fill="#21759b" rx="3"/>
  <rect x="28" y="139" width="44" height="5" fill="white" rx="1" opacity="0.8"/>

  <!-- Connecting arrow (center) -->
  <line x1="128" y1="99" x2="150" y2="99" stroke="#555" stroke-width="2" stroke-dasharray="3,2"/>
  <polygon points="150,95 158,99 150,103" fill="#555"/>

  <!-- MailChimp card (right side) -->
  <rect x="160" y="48" width="108" height="102" fill="white" rx="5"/>
  <!-- MailChimp header bar (yellow brand color) -->
  <rect x="160" y="48" width="108" height="18" fill="#FFE01B" rx="5 5 0 0"/>
  <!-- Chimp icon placeholder (simple abstract face) -->
  <circle cx="214" cy="53" r="7" fill="#241C15" opacity="0.85"/>
  <circle cx="211" cy="51" r="1.5" fill="white"/>
  <circle cx="217" cy="51" r="1.5" fill="white"/>
  <path d="M211 55 Q214 57.5 217 55" stroke="white" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <!-- List/audience items -->
  <rect x="170" y="74" width="88" height="7" fill="#FFE01B" rx="2" opacity="0.5"/>
  <rect x="170" y="74" width="20" height="7" fill="#FFE01B" rx="2"/>
  <rect x="170" y="85" width="88" height="7" fill="#f5f5f5" rx="2"/>
  <rect x="170" y="85" width="20" height="7" fill="#FFE01B" rx="2" opacity="0.6"/>
  <rect x="170" y="96" width="88" height="7" fill="#f5f5f5" rx="2"/>
  <rect x="170" y="96" width="20" height="7" fill="#FFE01B" rx="2" opacity="0.4"/>
  <!-- Envelope icon area -->
  <rect x="178" y="112" width="72" height="30" fill="#FFE01B" rx="4" opacity="0.2"/>
  <rect x="178" y="112" width="72" height="30" fill="none" stroke="#FFE01B" stroke-width="1.5" rx="4"/>
  <polyline points="178,112 214,132 250,112" fill="none" stroke="#FFE01B" stroke-width="1.5"/>
</svg>
